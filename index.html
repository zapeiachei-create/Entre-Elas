<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entre Elas • Píer Church</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff7f2,#f2c6c5,#b95c69);font-family:Arial;color:#5a2630}
.box{width:92%;max-width:420px;text-align:center}
.logo{font-weight:bold;letter-spacing:3px;margin-bottom:25px}
.logo small{display:block;font-size:11px;margin-top:5px}
.env{height:260px;background:#d77f87;border-radius:15px;position:relative;cursor:pointer;box-shadow:0 20px 50px #64243355}
.flap{position:absolute;width:100%;height:100%;background:#efa8a7;clip-path:polygon(0 0,50% 60%,100% 0);transition:.7s;transform-origin:top;z-index:3}
.open .flap{transform:rotateX(180deg)}
.seal{position:absolute;z-index:5;left:50%;top:48%;transform:translate(-50%,-50%);background:#7b2434;color:white;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font:30px Georgia}
.open .seal{display:none}
.hint{position:absolute;bottom:25px;width:100%;color:white;z-index:5;font-size:14px}
.open .hint{display:none}
.card{position:absolute;left:5%;width:90%;bottom:10px;background:#fffaf5;border-radius:14px;padding:25px 18px;opacity:0;transform:translateY(180px);transition:.8s;z-index:2;box-shadow:0 12px 30px #64243344}
.open .card{opacity:1;transform:translateY(-225px);z-index:10}
h1{font:44px Georgia;margin:0;color:#7b2434}
h2{font:italic 32px Georgia;margin:0;color:#c75f70}
.tag{font-size:11px;font-weight:bold;letter-spacing:1px;margin:12px}
.verse{font:16px Georgia;line-height:1.4;margin:15px 0}
.info{border-top:1px solid #e7c3c3;border-bottom:1px solid #e7c3c3;padding:12px;margin:15px 0;line-height:1.5}
.btn{display:block;background:#7b2434;color:white;text-decoration:none;padding:14px;border-radius:30px;font-weight:bold;margin-top:15px}
