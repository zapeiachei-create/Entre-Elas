<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entre Elas • Píer Church</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
background:linear-gradient(160deg,#fff7f2,#f2c6c5 55%,#b95c69);
font-family:Arial,sans-serif;
color:#5a2630;
overflow-x:hidden
}

.wrap{
width:min(94vw,430px);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:26px 14px
}

.stage{width:100%;text-align:center}

.brand{
font-weight:800;
letter-spacing:4px;
margin-bottom:24px;
color:#6e2633
}

.brand small{
display:block;
font-size:11px;
letter-spacing:5px;
margin-top:4px
}

.envelope{
position:relative;
width:100%;
height:260px;
background:#d77f87;
border-radius:12px;
box-shadow:0 24px 60px #64243355;
cursor:pointer;
transition:.7s;
perspective:1000px
}

.envelope:before{
content:"";
position:absolute;
inset:0;
clip-path:polygon(0 0,50% 58%,100% 0);
background:#efa8a7;
transform-origin:top;
transition:.75s;
z-index:4
}

.envelope.open:before{
transform:rotateX(180deg);
z-index:0
}

.envelope:after{
content:"";
position:absolute;
inset:0;
clip-path:polygon(0 100%,0 0,50% 58%,100% 0,100% 100%);
background:linear-gradient(135deg,#c86875,#df8d94);
z-index:3;
border-radius:12px
}

.seal{
position:absolute;
z-index:6;
left:50%;
top:48%;
transform:translate(-50%,-50%);
width:72px;
height:72px;
border-radius:50%;
background:#7b2434;
color:#fff;
display:grid;
place-items:center;
font-family:Georgia,serif;
font-size:29px;
box-shadow:0 6px 18px #5b1e2c66;
transition:.4s
}

.open .seal{
opacity:0;
transform:translate(-50%,-50%) scale(.5)
}

.hint{
position:absolute;
z-index:7;
left:0;
right:0;
bottom:24px;
color:white;
font-size:14px;
letter-spacing:1px;
transition:.3s
}

.open .hint{opacity:0}

.letter{
position:absolute;
z-index:2;
left:5%;
right:5%;
bottom:12px;
min-height:480px;
background:#fffaf5;
border-radius:12px;
padding:30px 22px 24px;
box-shadow:0 12px 35px #6b263044;
transform:translateY(210px) scale(.9);
opacity:0;
transition:1s cubic-bezier(.2,.8,.2,1)
}

.open .letter{
transform:translateY(-225px) scale(1);
opacity:1;
z-index:8
}

.letter h1{
font-family:Georgia,serif;
font-size:48px;
margin:0;
color:#7b2434;
line-height:.9
}

.letter h2{
font-family:Georgia,serif;
font-style:italic;
font-weight:400;
font-size:34px;
margin:0 0 10px;
color:#c75f70
}

.kicker{
font-size:11px;
letter-spacing:2.2px;
font-weight:700;
margin:14px 0 18px
}

.verse{
font-family:Georgia,serif;
font-size:17px;
line-height:1.45;
margin:18px 0;
color:#6b3740
}

.verse b{
display:block;
margin-top:6px;
font-family:Arial,sans-serif;
font-size:12px;
letter-spacing:2px
}

.details{
border-top:1px solid #e7c3c3;
border-bottom:1px solid #e7c3c3;
padding:15px 0;
margin:18px 0;
line-height:1.55;
font-size:15px
}

.details strong{color:#7b2434}

.btn{
display:block;
text-decoration:none;
background:#7b2434;
color:white;
padding:15px 16px;
border-radius:999px;
font-weight:700;
margin-top:17px;
box-shadow:0 8px 18px #7b243444
}

.note{
font-size:12px;
color:#95616a;
margin-top:13px
}

/* BOTÃO DA MÚSICA */

.music-btn{
position:fixed;
top:15px;
right:15px;
z-index:50;
display:none;
border:none;
border-radius:30px;
padding:11px 16px;
background:#7b2434;
color:white;
font-weight:bold;
font-size:13px;
box-shadow:0 5px 18px #642433
